<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Exercise — Fetch API</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <header>
      <span class="globi-icon"
        ><img
          src="https://globikinderkrippen.ch/wp-content/uploads/2023/11/globi-favicon.png"
          alt="globi"
          width="200"
      /></span>
      <h1>Globi's Bücher-Suche</h1>
      <p>Find your next adventure book!</p>
    </header>

    <div class="container">
      <div class="search-row">
        <input
          type="text"
          id="search-input"
          placeholder="Search for a book..."
        />
        <button id="search-btn">Suchen!</button>
      </div>
      <ul id="results"></ul>
    </div>
  </body>
</html>
